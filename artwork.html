<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="doc-title">Artwork — Trudi Connolly</title>
  <meta name="description" id="meta-desc" content="" />
  <meta name="theme-color" content="#282420">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital@0;1&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* --- Warm "Sepia" Dark Theme --- */
      --bg:#282420;
      --ink:#dcd8d1;
      --muted:#948f88;
      --accent:#d15a45;
      --link:#c58a47;
      --card:#3a3530; /* Using this for borders/placeholders */
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
    header,main,footer{max-width:960px;margin:0 auto;padding:1rem}
    header{padding-top:2rem}
    h1{font:700 2rem/1.2 Inter,sans-serif;margin:.25rem 0}
    .series{font:italic 1.1rem "Crimson Text",serif;color:var(--accent)}
    .meta{color:var(--muted);margin:.25rem 0 1rem}
    .toolbar{display:flex;gap:.75rem;flex-wrap:wrap;margin:1rem 0}
    .toolbar a{color:var(--link);text-decoration:none;border:1px solid var(--card);border-radius:.5rem;padding:.4rem .7rem}
    .toolbar a:hover{color:var(--accent);border-color:var(--accent)}
    figure{margin:1rem 0}
    
    img.hero{display:block;max-width:100%;height:auto;max-height:80vh;object-fit:contain;border-radius:.5rem;background:var(--card)}
    
    figcaption{font:italic 1.25rem/1.6 "Crimson Text",serif;margin:.75rem 0 0;white-space:pre-wrap}
    
    footer{color:#9a9a9a;font-size:.85rem;text-align:center;padding:2rem 1rem 3rem}
    footer a { color: inherit; }
    footer a:hover { color: var(--accent); }
    .warn{background:#5c4033;border:1px solid #8b5a2b;color:#f0e6d6;padding:.75rem;border-radius:.5rem}
  </style>

  <script src="artworks.js"></script>
  <script>
  (function(){
    const qs   = new URLSearchParams(location.search);
    const slug = qs.get('slug');

    // Updated to sort by number instead of alphabetically
    function getSortedWorks(list){
      return Object.entries(list).map(([s,d])=>{
        const title = d.title || s.replaceAll('_',' ');
        return {slug:s, ...d, title};
      }).sort((a,b) => a.number - b.number);
    }
    
    function neighbors(list, slug){
      const i = list.findIndex(x=>x.slug===slug);
      if (i<0) return {prev:'#', next:'#'};
      const prev = list[(i-1+list.length)%list.length].slug;
      const next = list[(i+1)%list.length].slug;
      return { prev:`artwork.html?slug=${encodeURIComponent(prev)}`,
               next:`artwork.html?slug=${encodeURIComponent(next)}` };
    }
    
    function setHead(title, meta){
      document.getElementById('doc-title').textContent = `${title} — Trudi Connolly`;
      document.getElementById('meta-desc').setAttribute('content',(meta?meta+' · ':'')+'by Trudi Connolly.');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (!window.ARTWORKS) return;
      if (!slug) return;

      const data = ARTWORKS[slug];
      if (!data) return;

      const list = getSortedWorks(ARTWORKS);
      const {prev, next} = neighbors(list, slug);
      document.getElementById('prevLink').href = prev;
      document.getElementById('nextLink').href = next;

      const title = data.title || slug.replaceAll('_',' ');
      const meta  = [data.medium, data.size, data.year].filter(Boolean).join(' · ');
      setHead(title, meta);

      document.getElementById('title').textContent = title;
      if (meta) document.getElementById('meta').textContent = meta;

      const imgPath = `images/${slug}.jpg`;
      const hero    = document.getElementById('hero');
      hero.src = imgPath; hero.alt = `${title} collage by Trudi Connolly`;

      if (data.caption) document.getElementById('caption').textContent = data.caption;

      document.getElementById('download').href = imgPath;

      // keyboard navigation
      window.addEventListener('keydown', (e) => {
        if(e.key === 'ArrowLeft') location.href = prev;
        if(e.key === 'ArrowRight') location.href = next;
      });
    });
  })();
  </script>
</head>
<body>
  <header>
    <div class="series">Illuminations / Sacred Paper</div>
    <h1 id="title">Artwork</h1>
    <div id="meta" class="meta"></div>
    <nav class="toolbar" aria-label="Artwork navigation">
      <a id="prevLink" href="#">← Previous</a>
      <a href="index.html">Gallery</a>
      <a id="nextLink" href="#">Next →</a>
    </nav>
  </header>

  <main id="main">
    <figure>
      <img id="hero" class="hero" src="" alt="" />
      <figcaption id="caption"></figcaption>
    </figure>
    <div class="toolbar">
      <a id="download" href="#" download>Open Full Resolution</a>
    </div>
  </main>

  <footer>
    © 2026 Trudi Connolly. All rights reserved. · 
    <a href="mailto:Trudi@TrudiConnolly.com">contact</a> · 
    <a href="about.html">artist’s statement</a>
  </footer>
</body>
</html>
