<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trudi Connolly — Illuminations / Sacred Paper</title>
  <meta name="description" content="A selection of cut-paper collages by Trudi Connolly: Illuminations / Sacred Paper.">
  <meta name="theme-color" content="#282420">

  <link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" sizes="180x180">
  <link rel="icon" href="android-chrome-192x192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital@0;1&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* --- Warm "Sepia" Dark Theme --- */
      --bg:#282420;      /* Very dark, warm brown */
      --ink:#dcd8d1;     /* Soft, warm off-white */
      --muted:#948f88;   /* Muted, warm grey */
      --accent:#d15a45; /* Softer, terracotta red */
      --link:#c58a47;    /* Muted gold/ochre */
      --card:#3a3530;    /* Dark, warm grey-brown */
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif; }
    a { color:var(--link); text-decoration:none; }
    a:hover { color:var(--accent); }

    header, main, footer { max-width:1200px; margin:0 auto; padding:1rem; }
    header { padding-top:2rem; }
    h1 { font:700 2.5rem/1.1 Inter,sans-serif; margin:.25rem 0; }
    .series { font:italic 1.25rem "Crimson Text",serif; color:var(--accent); }

    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1.25rem; margin-top:1rem; }

    .card {
      position:relative; width:100%; aspect-ratio:1/1;
      overflow:hidden; border-radius:.75rem; background:var(--card);
      box-shadow:0 1px 2px rgba(0,0,0,.06);
      transition:transform .08s ease-in-out, box-shadow .12s ease-in-out;
    }
    .card:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,0,0,.15); }
    .card > a { position:absolute; inset:0; display:block; }

    .thumb { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }

    .meta {
      position:absolute; left:0; right:0; bottom:0;
      background:rgba(40, 36, 32, 0.8); /* Warm, semi-transparent background */
      backdrop-filter:blur(2px);
      padding:.5rem .75rem; font-size:.9rem;
    }
    .title { font-weight:600; }
    .no { color:var(--muted); margin-left:.35rem; }

    /* --- Custom styles for the statement card --- */
    #statement-card { aspect-ratio: auto; }
    #statement-card > a {
      position: relative; display: flex; flex-direction: column;
      justify-content: space-between; height: 100%; padding: 1.25rem;
    }
    .statement-title { font: italic 1.2rem "Crimson Text", serif; color: var(--accent); margin-bottom: 0.5rem; }
    .statement-body { font-size: 0.95rem; line-height: 1.6; margin: 0; }
    .statement-cta { font-weight: 600; color: var(--link); margin-top: 1rem; align-self: start; }
    #statement-card:hover .statement-cta { color: var(--accent); }
    /* --- End custom styles --- */

    footer { color:#9a9a9a; font-size:.85rem; text-align:center; padding:2rem 1rem 3rem; }
    footer a { color: inherit; } /* Makes footer links match footer text color */
    footer a:hover { color: var(--accent); } /* Highlights on hover */

    @media (max-width:420px) { h1 { font-size:2rem; } .series{font-size:1.1rem;} }
  </style>
</head>
<body>
  <header>
    <h1>Trudi Connolly</h1>
    <div class="series">Illuminations / Sacred Paper</div>
  </header>

  <main>
    <section class="grid" aria-label="Gallery">
      </section>
  </main>

  <footer>
    © 2025 Trudi Connolly. All rights reserved. ·
    <a href="mailto:Trudi@TrudiConnolly.com">contact</a> ·
    <a href="about.html">artist’s statement</a>
  </footer>

  <script src="artworks.js"></script>
  <script>
  (function() {
    if (!window.ARTWORKS) {
      console.error("ARTWORKS data not found.");
      return;
    }

    const grid = document.querySelector('.grid');
    grid.innerHTML = ''; // Clear any fallback content

    // --- NEW: Create and add the Artist's Statement card first ---
    const statementCardHTML = `
      <article class="card" id="statement-card">
        <a href="about.html">
          <div>
            <h3 class="statement-title">Artist’s Statement</h3>
            <p class="statement-body">
              I make minutely hand-cut paper collages that read as illuminated pages from books that do not exist—part sacred text, part guide for living...
            </p>
          </div>
          <div class="statement-cta">Read More →</div>
        </a>
      </article>
    `;
    grid.insertAdjacentHTML('beforeend', statementCardHTML);
    // --- End new section ---


    // Sort artworks alphabetically by title for a consistent order
    const sortedWorks = Object.entries(ARTWORKS).map(([slug, data]) => {
      const title = data.title || slug.replaceAll('_', ' ');
      return { slug, ...data, title, key: title.toLowerCase() };
    }).sort((a, b) => a.key.localeCompare(b.key, undefined, { sensitivity: 'base' }));

    // Loop through the sorted artworks and create a card for each
    for (const art of sortedWorks) {
      const slug = art.slug;
      const title = art.title;
      const number = art.number;
      const thumbSrc = `images/${slug}_1000.jpg`;

      // Use the new, correct URL format
      const linkHref = `artwork.html?slug=${encodeURIComponent(slug)}`;

      // Create the HTML for the card
      const cardHTML = `
        <article class="card">
          <a href="${linkHref}">
            <img class="thumb" src="${thumbSrc}" alt="${title}" loading="lazy">
            <div class="meta">
              <span class="title">${title}</span>
              ${number ? `<span class="no"># ${number}</span>` : ''}
            </div>
          </a>
        </article>
      `;

      grid.insertAdjacentHTML('beforeend', cardHTML);
    }
  })();
  </script>

</body>
</html>
